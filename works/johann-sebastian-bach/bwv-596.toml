catalogue = "BWV 596"
title = "Organ Concerto in D Minor (after Vivaldi)"
form = "Concerto"
period = "Baroque"
key_sig = "D Minor"
description = "Bach's arrangement for organ of Vivaldi's Concerto No. 11 from L'estro armonico (RV 565), made at Weimar around 1714–17 while he studied the Italian concerto. The two violins and cello are shared out between the hands and pedals; the fugue after the opening Adagio becomes a full organ fugue. The manuscript is in Bach's hand, but a note by his son Wilhelm Friedemann on it had the piece taken for the son's own until the twentieth century."
