description = "A concerto from Bach's Leipzig years, probably arranged from a lost original for other instruments, and perhaps written for Bach to play with his eldest sons, Wilhelm Friedemann and Carl Philipp Emanuel. The first harpsichord leads, and the slow movement is a siciliano."
