description = "Bach's arrangement of Vivaldi's Concerto for four violins in B minor from L'estro armonico (RV 580), moved down a tone to A minor, made in Leipzig around 1730, probably for the Collegium Musicum he led at Zimmermann's coffee house. It is his only concerto for four keyboards, and the last of his many reworkings of Vivaldi."
