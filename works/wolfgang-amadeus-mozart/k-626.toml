description = "Mozart's last work, a requiem mass commissioned anonymously in 1791 by Count Franz von Walsegg in memory of his wife, and left unfinished when Mozart died that December: only the Introit was complete, the movements from the Kyrie to the Hostias were sketched, and the Lacrimosa broke off after eight bars. His pupil Franz Xaver Süssmayr finished it, writing the Sanctus, Benedictus and Agnus Dei himself, and his completion is the one usually played."
