catalogue = "WWV 86A"
title = "Das Rheingold"
form = "Opera"
period = "Romantic"
composed = 1854
description = "The first of the four operas of Wagner's Ring cycle, in one act of four scenes, first staged in Munich in 1869. Its prelude stays on a single chord of E-flat major for 136 bars, horns, then cellos, then more strings adding ever faster arpeggios, as the Rhine rises out of the depths."
