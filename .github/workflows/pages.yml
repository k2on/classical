# Every push to main: the catalogue built and checked (catalogue.nix), and
# published at https://k2on.github.io/classical/catalogue.json.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      - run: |
          mkdir _site
          cp "$(nix build --print-out-paths --no-link .#catalogue)" _site/catalogue.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}catalogue.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
