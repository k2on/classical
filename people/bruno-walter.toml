description = "German-born conductor, Mahler's assistant in Vienna, who gave the first performances of Das Lied von der Erde and the Ninth Symphony after Mahler's death. Driven out of Germany and then Austria by the Nazis, he settled in the United States, and was celebrated above all for his Mozart and Mahler."
