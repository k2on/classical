description = "Austrian composer from Salzburg, toured across Europe as a child prodigy and, from 1781, worked freelance in Vienna. In a life of thirty-five years he wrote more than 600 works, among them over forty symphonies, twenty-seven piano concertos and the operas Le nozze di Figaro, Don Giovanni and Die Zauberflöte."
