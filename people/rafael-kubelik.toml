description = "Czech conductor, son of the violinist Jan Kubelík, chief conductor of the Czech Philharmonic from 1942 until he left Czechoslovakia in 1948. He later led the Chicago Symphony and the Bavarian Radio Symphony Orchestra, and came home to conduct Má vlast in Prague in 1990."
